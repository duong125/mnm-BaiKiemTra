<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Quản lý Sách{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f1f5f9; color: #0f172a; line-height: 1.6; }
        nav { background: #1e293b; padding: 12px 24px; display: flex; align-items: center; gap: 24px; }
        nav a { color: #e2e8f0; text-decoration: none; font-size: 15px; }
        nav a:hover { color: #fff; }
        nav .brand { font-weight: 700; font-size: 18px; color: #fff; }
        .wrap { max-width: 900px; margin: 24px auto; padding: 0 16px; }
        h1 { font-size: 26px; margin-bottom: 16px; }
        h2 { font-size: 20px; margin-bottom: 12px; }
        .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; font-weight: 600; font-size: 14px; color: #475569; }
        .btn { display: inline-block; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; border: none; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-danger { background: #dc2626; color: #fff; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-secondary { background: #e2e8f0; color: #334155; }
        .btn-secondary:hover { background: #cbd5e1; }
        .btn-sm { padding: 5px 12px; font-size: 13px; }
        .actions { display: flex; gap: 6px; }
        input[type=text], input[type=number], select, textarea { width: 100%; padding: 10px 14px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 15px; margin-top: 4px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #2563eb; }
        label { display: block; font-weight: 600; margin-top: 14px; font-size: 15px; }
        .error { background: #fef2f2; color: #991b1b; padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }
        .stat { background: #fff; border-radius: 12px; padding: 18px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .stat .num { font-size: 36px; font-weight: 700; color: #2563eb; }
        .stat .label { font-size: 14px; color: #64748b; margin-top: 4px; }
        .empty { color: #94a3b8; font-style: italic; padding: 20px; text-align: center; }
        .badge { display: inline-block; background: #e0f2fe; color: #0369a1; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
    </style>
</head>
<body>
    <nav>
        <a class="brand" href="{{ url_for('dashboard') }}">📚 Quản lý Sách</a>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('category_list') }}">Danh mục</a>
    </nav>
    <div class="wrap">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
