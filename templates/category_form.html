{% extends "base.html" %}
{% block title %}{{ "Sửa" if cat else "Thêm" }} danh mục{% endblock %}
{% block content %}
<h1>{{ "Sửa" if cat else "Thêm" }} danh mục</h1>
<div class="card">
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
        <label>Tên danh mục</label>
        <input type="text" name="name" value="{{ cat.name if cat else '' }}" required>
        <label>Mô tả</label>
        <textarea name="description" rows="3">{{ cat.description if cat else '' }}</textarea>
        <div style="margin-top:18px;display:flex;gap:10px">
            <button type="submit" class="btn btn-primary">{{ "Cập nhật" if cat else "Thêm" }}</button>
            <a href="{{ url_for('category_list') }}" class="btn btn-secondary">Hủy</a>
        </div>
    </form>
</div>
{% endblock %}
